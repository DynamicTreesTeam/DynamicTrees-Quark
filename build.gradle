plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.120'
}

version = project.mod_version
group = project.mod_group_id

repositories {
    mavenLocal()
    maven {
        url = "https://maven.neoforged.net/releases/"
    }
    maven {
        url = "https://www.cursemaven.com"
    }
}

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

neoForge {
    version = project.neoforge_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
        }

        server {
            server()
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath(),
                    "--existing-mod", "dynamictrees",
                    "--existing-mod", "quark"
        }
    }
}

dependencies {
    // NeoForge provided by plugin

    // Quark 4.1-473 (CurseMaven)
    implementation "curse.maven:quark-243121:7625365"

    // Zeta 1.1-38 (CurseMaven)
    implementation "curse.maven:zeta-968868:7625372"

    // Dynamic Trees 1.6.0 (CurseMaven) — DT+ 1.3.1 requires >=1.6.0
    implementation "curse.maven:dynamictrees-252818:7513464"

    // Dynamic Trees Plus 1.3.1 (CurseMaven)
    implementation "curse.maven:dynamictreesplus-478155:7513822"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    // Both src/main/resources and src/generated/resources are registered as resource srcDirs.
    // Some paths (e.g. ancient_fruit blockstate, glow_shroom models, DT tags) legitimately live in
    // both trees — hand-authored in main/resources, re-emitted by datagen into generated/resources.
    // EXCLUDE keeps the first occurrence (main/resources, declared first) and drops subsequent
    // duplicates from generated/resources, matching the reference build's strategy.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
