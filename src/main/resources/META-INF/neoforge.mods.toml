modLoader="javafml"
loaderVersion="[4,)"
license="MIT"
issueTrackerURL="https://github.com/DynamicTreesTeam/DynamicTrees-Quark/issues"

[[mods]]
modId="dtquark"
version="${file.jarVersion}"
displayName="Dynamic Trees for Quark"
logoFile="dtquark_logo.png"
authors="Max Hyper, Violet Moon"
description='''
Compatibility Mod between Dynamic Trees and Quark for NeoForge 1.21.1
'''

[[dependencies.dtquark]]
    modId="neoforge"
    mandatory=true
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.dtquark]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"

[[dependencies.dtquark]]
    modId="dynamictrees"
    mandatory=true
    versionRange="[1.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.dtquark]]
    modId="quark"
    mandatory=true
    versionRange="[4.1,)"
    ordering="AFTER"
    side="BOTH"

# Optional: load AFTER Dynamic Trees Plus so our entries can splice into DT+ cactus/fungus
# species chains (e.g. glimmering_weald's glow_shroom) without being overwritten.
[[dependencies.dtquark]]
    modId="dynamictreesplus"
    mandatory=false
    versionRange="[1.3,)"
    ordering="AFTER"
    side="BOTH"

# Optional: load AFTER Dynamic Trees for Terralith so our splice_before entries on
# terralith:* biomes (blooming_valley, lush_valley, lush_desert, etc.) process AFTER
# DTTerralith's REPLACE operations. Without this, DTTerralith may wipe our
# dtquark:azalea additions from those biomes. See BiomePopulatorsResourceLoader —
# load order determines whether splice_before sees the prior chain or an empty one.
[[dependencies.dtquark]]
    modId="dtterralith"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

# Optional: load AFTER Terralith itself so any Terralith-provided tree pack data
# is registered before ours.
[[dependencies.dtquark]]
    modId="terralith"
    mandatory=false
    versionRange="[2.0,)"
    ordering="AFTER"
    side="BOTH"
